name: One-time canvas hardening (isolated branch)

on:
  push:
    branches:
      - fix/agent-library-secure-vault-20260918

permissions:
  contents: write

jobs:
  apply-reviewed-patch:
    if: github.ref == 'refs/heads/fix/agent-library-secure-vault-20260918'
    runs-on: ubuntu-latest
    steps:
      - name: Check out isolated branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply exact-match source migration
        run: node scripts/apply-canvas-hardening.cjs
      - name: Check generated diff
        run: |
          git diff --check
          git diff --stat
          git diff -- src/components/AIWonderCanvas.tsx | head -n 260 || true
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Commit verified canvas change and remove one-time automation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/AIWonderCanvas.tsx
          git rm -- scripts/apply-canvas-hardening.cjs .github/workflows/one-time-canvas-hardening.yml
          git commit -m 'Block unsafe browser credentials and fake node execution in legacy canvas'
          git push origin HEAD:fix/agent-library-secure-vault-20260918
