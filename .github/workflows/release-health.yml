name: Playground release health
on:
  workflow_run:
    workflows: ['Deploy AI Playground to UpCloud VM']
    types: [completed]
  schedule:
    - cron: '35 9 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-smoke:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Verify public API, page and JavaScript MIME
        id: smoke
        shell: bash
        run: |
          set -euo pipefail
          url=https://playground.dreammakerhub.website
          curl -fsS --max-time 15 "$url/api/health" >/dev/null
          html="$(curl -fsS --max-time 15 "$url/")"
          grep -q 'id="root"' <<< "$html" || { echo 'SPA root missing'; exit 1; }
          asset="$(grep -oE '/assets/[^" ]+\.js' <<< "$html" | head -n 1 || true)"
          test -n "$asset" || { echo 'JavaScript asset missing'; exit 1; }
          headers="$(curl -fsSI --max-time 15 "$url$asset")"
          grep -Eiq '^content-type: *(application|text)/(javascript|x-javascript)' <<< "$headers" || { echo 'JavaScript MIME is incorrect'; exit 1; }
          echo 'Public Playground smoke passed.'
      - name: Open or update issue on failed production smoke
        if: failure() && steps.smoke.outcome == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title='Playground public smoke checks failing'
          existing="$(gh issue list --state open --json number,title --jq '.[] | select(.title == "Playground public smoke checks failing") | .number' | head -n 1)"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Public smoke failed again: $RUN_URL"
          else
            gh issue create --title "$title" --body "Public API, SPA or JavaScript MIME check failed: $RUN_URL. No credentials were used."
          fi
