name: Code Quality & Coverage

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  quality:
    name: Lint & Build
    runs-on: ubuntu-latest

    steps:
      # 1. Fetch the repository codebase
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Set up Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm' # Automatically caches node_modules for faster runs

      # 3. Install project dependencies
      - name: Install Dependencies
        run: npm ci

      # 4. Typecheck (tsc --noEmit)
      - name: Typecheck
        run: npm run lint

      # 5. Production build
      - name: Build
        run: npm run build