name: Credential snapshot regression
on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --test tests/deployment-policy.test.mjs
      - run: node --import tsx --test tests/sanitizeWorkflow.test.ts
      - run: npm run lint
      - run: npm run build
