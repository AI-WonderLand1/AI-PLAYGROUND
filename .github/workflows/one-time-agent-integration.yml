name: One-time saved-agent vault integration

on:
  push:
    branches: [fix/agent-library-secure-vault-20260918]

permissions:
  contents: write

jobs:
  integrate:
    if: github.ref == 'refs/heads/fix/agent-library-secure-vault-20260918'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply exact-match integration patch
        run: node scripts/wire-agent-library.cjs
      - name: Validate generated diff
        run: git diff --check
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Commit verified integration and remove temporary automation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx src/components/Playground.tsx
          git rm scripts/wire-agent-library.cjs .github/workflows/one-time-agent-integration.yml
          git commit -m 'Route saved agent chat through vault and expose agent library'
          git push origin HEAD:fix/agent-library-secure-vault-20260918
