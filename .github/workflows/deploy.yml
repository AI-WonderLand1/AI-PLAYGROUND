name: Deploy AI Playground to UpCloud VM

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-playground-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Secret-free Playground build
    runs-on: ubuntu-latest
    # Even internal pull requests run contributor-controlled npm scripts.
    # No private key or production provider token belongs in this job.
    env:
      VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
      VITE_SUPABASE_ANON_KEY: ci-public-placeholder
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  deploy:
    name: Deploy verified Playground commit
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment: production
    env:
      UPCLOUD_SERVER_IP: ${{ vars.UPCLOUD_SERVER_IP || '209.50.53.112' }}
      UPCLOUD_SSH_USER: ${{ vars.UPCLOUD_SSH_USER || 'root' }}
      SSH_PRIVATE_KEY: ${{ secrets.UPCLOUD_SSH_KEY || secrets.UPLOAD_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || vars.NEXT_PUBLIC_SUPABASE_URL || vars.SUPABASE_URL || secrets.VITE_SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL || secrets.SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY || vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - name: Validate deploy inputs
        shell: bash
        run: |
          set -euo pipefail
          test -n "$UPCLOUD_SERVER_IP" && test -n "$SSH_PRIVATE_KEY" || { echo 'Missing UpCloud host or SSH key'; exit 1; }
          test -n "$VITE_SUPABASE_URL" && test -n "$VITE_SUPABASE_ANON_KEY" || { echo 'Missing public Supabase build configuration'; exit 1; }
          case "$VITE_SUPABASE_URL" in https://*.supabase.co) ;; *) echo 'Invalid Supabase URL'; exit 1;; esac
          for value in "$VITE_SUPABASE_URL" "$VITE_SUPABASE_ANON_KEY"; do
            [[ "$value" != *$'\n'* && "$value" != *$'\r'* ]] || { echo 'Multiline frontend config is not supported'; exit 1; }
          done
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$UPCLOUD_SERVER_IP" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Upload public frontend configuration
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          config="$RUNNER_TEMP/ai-playground.env.production"
          printf 'VITE_SUPABASE_URL=%s\nVITE_SUPABASE_ANON_KEY=%s\n' "$VITE_SUPABASE_URL" "$VITE_SUPABASE_ANON_KEY" > "$config"
          scp "$config" "$UPCLOUD_SSH_USER@$UPCLOUD_SERVER_IP:/tmp/ai-playground.env.production"
          rm -f "$config"
      - name: Deploy exact successful-build commit
        shell: bash
        run: |
          set -euo pipefail
          ssh "$UPCLOUD_SSH_USER@$UPCLOUD_SERVER_IP" "EXPECTED_SHA='$GITHUB_SHA' bash -s" <<'REMOTE'
            set -euo pipefail
            [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Invalid expected commit SHA'; exit 1; }
            APP_DIR=/opt/AI-PLAYGROUND
            for command in git node npm nginx; do command -v "$command" >/dev/null || { echo "Missing $command"; exit 1; }; done
            test -s /tmp/ai-playground.env.production || { echo 'Missing frontend configuration'; exit 1; }
            if [ -d "$APP_DIR/.git" ]; then
              git -C "$APP_DIR" fetch origin main
            else
              rm -rf "$APP_DIR"
              git clone --branch main https://github.com/AI-WonderLand1/AI-PLAYGROUND.git "$APP_DIR"
            fi
            git -C "$APP_DIR" cat-file -e "$EXPECTED_SHA^{commit}" || { echo 'Expected commit unavailable on deploy host'; exit 1; }
            git -C "$APP_DIR" reset --hard "$EXPECTED_SHA"
            cd "$APP_DIR"
            install -m 0600 /tmp/ai-playground.env.production .env.production
            rm -f /tmp/ai-playground.env.production
            if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
            npm run build
            supabase_url="$(sed -n 's/^VITE_SUPABASE_URL=//p' .env.production | head -n 1)"
            test -n "$supabase_url" && grep -RqsF "$supabase_url" dist || { echo 'Built SPA does not contain configured Supabase URL'; exit 1; }
            printf '%s\n' '[Unit]' 'Description=AI Wonderland Playground' 'After=network-online.target' 'Wants=network-online.target' '' '[Service]' 'Type=simple' 'WorkingDirectory=/opt/AI-PLAYGROUND' 'Environment=NODE_ENV=production' 'Environment=PORT=3001' 'EnvironmentFile=-/opt/AI-PLAYGROUND/.env' 'ExecStart=/usr/bin/env npm start' 'Restart=always' 'RestartSec=5' '' '[Install]' 'WantedBy=multi-user.target' > /etc/systemd/system/ai-playground.service
            systemctl daemon-reload
            systemctl enable ai-playground.service >/dev/null
            systemctl restart ai-playground.service
            healthy=0
            for attempt in 1 2 3 4 5 6 7 8; do
              if curl -fsS http://127.0.0.1:3001/api/health >/dev/null && curl -fsS http://127.0.0.1:3001/ | grep -q 'id="root"'; then healthy=1; break; fi
              sleep 3
            done
            test "$healthy" -eq 1 || { echo 'Playground backend or frontend failed to become ready'; exit 1; }
            nginx -t
            echo "Playground commit $EXPECTED_SHA started and passed localhost checks"
          REMOTE
      - name: Verify public Playground deployment
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 4 --retry-delay 2 https://playground.dreammakerhub.website/api/health >/dev/null
          html="$(curl -fsS --retry 4 --retry-delay 2 https://playground.dreammakerhub.website/)"
          grep -q 'id="root"' <<< "$html" || { echo 'Public Playground SPA root missing'; exit 1; }
          asset="$(grep -oE '/assets/[^" ]+\.js' <<< "$html" | head -n 1 || true)"
          test -n "$asset" || { echo 'Public Playground JavaScript asset missing'; exit 1; }
          headers="$(curl -fsSI "https://playground.dreammakerhub.website$asset")"
          grep -Eiq '^content-type: *(application|text)/(javascript|x-javascript)' <<< "$headers" || { echo 'Playground JavaScript has incorrect MIME type'; exit 1; }
          echo 'Public Playground API, SPA and JS MIME passed.'
