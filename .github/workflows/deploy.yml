name: Deploy AI Playground to UpCloud VM

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  UPCLOUD_SERVER_IP: ${{ vars.UPCLOUD_SERVER_IP || '209.50.53.112' }}
  UPCLOUD_SSH_USER: ${{ vars.UPCLOUD_SSH_USER || 'root' }}
  SSH_PRIVATE_KEY: ${{ secrets.UPLOAD_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
  VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
  VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

jobs:
  build:
    runs-on: ubuntu-latest
    name: Verify AI Playground build
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate Supabase frontend configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VITE_SUPABASE_URL" || { echo "Missing GitHub secret: VITE_SUPABASE_URL" >&2; exit 1; }
          test -n "$VITE_SUPABASE_ANON_KEY" || { echo "Missing GitHub secret: VITE_SUPABASE_ANON_KEY" >&2; exit 1; }
          case "$VITE_SUPABASE_URL" in
            https://*) ;;
            *) echo "VITE_SUPABASE_URL must be an https:// URL" >&2; exit 1 ;;
          esac

      - name: Build frontend
        run: npm run build

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    name: Deploy AI Playground to UpCloud

    steps:
      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$UPCLOUD_SERVER_IP" || { echo "Missing repository variable: UPCLOUD_SERVER_IP"; exit 1; }
          test -n "$SSH_PRIVATE_KEY" || { echo "Missing GitHub SSH secret: UPLOAD_SSH_KEY or SSH_PRIVATE_KEY"; exit 1; }
          test -n "$VITE_SUPABASE_URL" || { echo "Missing GitHub secret: VITE_SUPABASE_URL" >&2; exit 1; }
          test -n "$VITE_SUPABASE_ANON_KEY" || { echo "Missing GitHub secret: VITE_SUPABASE_ANON_KEY" >&2; exit 1; }
          echo "Deploy target: ${UPCLOUD_SSH_USER}@${UPCLOUD_SERVER_IP}"

      - name: Set up SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$UPCLOUD_SERVER_IP" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload Supabase frontend configuration
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          {
            printf 'VITE_SUPABASE_URL=%s\n' "$VITE_SUPABASE_URL"
            printf 'VITE_SUPABASE_ANON_KEY=%s\n' "$VITE_SUPABASE_ANON_KEY"
          } > /tmp/ai-playground.env.production
          scp /tmp/ai-playground.env.production \
            "$UPCLOUD_SSH_USER@$UPCLOUD_SERVER_IP:/tmp/ai-playground.env.production"
          rm -f /tmp/ai-playground.env.production

      - name: Deploy and restart AI Playground
        shell: bash
        run: |
          set -euo pipefail
          ssh "$UPCLOUD_SSH_USER@$UPCLOUD_SERVER_IP" 'bash -s' <<'REMOTE'
            set -euo pipefail
            APP_DIR=/opt/AI-PLAYGROUND

            command -v git >/dev/null || { echo "git is required on the VM" >&2; exit 1; }
            command -v node >/dev/null || { echo "Node.js is required on the VM" >&2; exit 1; }
            command -v npm >/dev/null || { echo "npm is required on the VM" >&2; exit 1; }
            command -v nginx >/dev/null || { echo "nginx is required on the VM" >&2; exit 1; }
            test -s /tmp/ai-playground.env.production || { echo "Supabase frontend configuration was not uploaded" >&2; exit 1; }

            if [ -d "$APP_DIR/.git" ]; then
              git -C "$APP_DIR" fetch origin main
              git -C "$APP_DIR" reset --hard origin/main
            else
              rm -rf "$APP_DIR"
              git clone --branch main --single-branch https://github.com/AI-WonderLand1/AI-PLAYGROUND.git "$APP_DIR"
            fi

            cd "$APP_DIR"
            install -m 0600 /tmp/ai-playground.env.production "$APP_DIR/.env.production"
            rm -f /tmp/ai-playground.env.production

            if [ ! -f .env ]; then
              echo "WARNING: $APP_DIR/.env is missing; server-side provider features may be unavailable until production variables are added." >&2
            fi

            if [ -f package-lock.json ]; then
              npm ci --no-audit --no-fund
            else
              npm install --no-audit --no-fund
            fi
            npm run build

            supabase_url="$(sed -n 's/^VITE_SUPABASE_URL=//p' .env.production | head -n 1)"
            if [ -z "$supabase_url" ] || ! grep -RqsF "$supabase_url" dist; then
              echo "Production bundle does not contain the configured Supabase URL." >&2
              exit 1
            fi

            # Run one production process for both the SPA and API. Express serves
            # /opt/AI-PLAYGROUND/dist and all /api routes on port 3001.
            printf '%s\n' \
              '[Unit]' \
              'Description=AI Wonderland Playground' \
              'After=network-online.target' \
              'Wants=network-online.target' \
              '' \
              '[Service]' \
              'Type=simple' \
              'WorkingDirectory=/opt/AI-PLAYGROUND' \
              'Environment=NODE_ENV=production' \
              'Environment=PORT=3001' \
              'EnvironmentFile=-/opt/AI-PLAYGROUND/.env' \
              'ExecStart=/usr/bin/env npm start' \
              'Restart=always' \
              'RestartSec=5' \
              '' \
              '[Install]' \
              'WantedBy=multi-user.target' \
              > /etc/systemd/system/ai-playground.service

            systemctl daemon-reload
            systemctl enable ai-playground.service >/dev/null
            systemctl restart ai-playground.service

            # Verify both the API and the built SPA directly on Express first.
            healthy=0
            for attempt in 1 2 3 4 5 6 7 8; do
              if curl -fsS http://127.0.0.1:3001/api/health >/dev/null \
                && curl -fsS http://127.0.0.1:3001/ | grep -q '<div id="root"></div>'; then
                healthy=1
                break
              fi
              sleep 3
            done

            if [ "$healthy" -ne 1 ]; then
              echo "AI Playground production process failed health/frontend checks." >&2
              systemctl --no-pager --full status ai-playground.service || true
              journalctl -u ai-playground.service -n 80 --no-pager || true
              exit 1
            fi

            # This VM already uses nginx for ports 80/443 and TLS. Do not install,
            # start, or overwrite another reverse proxy here. Validate the existing
            # nginx configuration and verify that its Playground vhost reaches the
            # production Express process on port 3001.
            nginx -t

            if curl -kfsS \
              --resolve playground.dreammakerhub.website:443:127.0.0.1 \
              https://playground.dreammakerhub.website/ \
              | grep -q '<div id="root"></div>'; then
              echo "AI Playground API and frontend checks passed through nginx."
            else
              echo "AI Playground is healthy on port 3001, but the nginx Playground vhost did not return the production SPA." >&2
              exit 1
            fi
          REMOTE
