name: One-time runtime hardening extraction
on:
  push:
    branches: [fix/agent-library-secure-vault-20260918]
permissions:
  contents: write
jobs:
  extract:
    if: github.ref == 'refs/heads/fix/agent-library-secure-vault-20260918'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: node scripts/harden-runtime-extraction.cjs
      - run: git diff --check
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
      - name: Commit tested refactor and delete one-off script/workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/AIWonderCanvas.tsx server/agent-vault.ts
          git rm scripts/harden-runtime-extraction.cjs .github/workflows/one-time-extraction.yml
          git commit -m 'Extract credential panel and propagate HTTP and n8n node failures'
          git push origin HEAD:fix/agent-library-secure-vault-20260918
