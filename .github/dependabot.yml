# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Keeps your npm dependencies (packages in package.json) updated
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # @react-three/fiber 9.7 currently requires React/React DOM < 19.3.
    # Hold these updates until the Three/Fiber peer range supports 19.3.
    ignore:
      - dependency-name: "react"
        versions: [">=19.3.0"]
      - dependency-name: "react-dom"
        versions: [">=19.3.0"]

  # Keeps your GitHub Actions workflows updated
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
